name: Build Slopchik Desktop

on:
  workflow_dispatch:
    inputs:
      icon_variant:
        description: "Вариант иконки Windows-приложения"
        required: true
        type: choice
        default: lime
        options:
          - lime
          - lime-invert
          - purple
          - orange
          - pink
          - blue
          - teal
          - rainbow
  push:
    branches:
      - desktop-app
    paths:
      - "desktop/src-tauri/**"
      - "desktop/index.html"
      - "desktop/scripts/**"
      - "Brand book/icons/lime/square-1024.png"
      - ".github/workflows/build-desktop.yml"

permissions:
  contents: read

concurrency:
  group: slopchik-desktop-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python for icon generation
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate official Windows app icon
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python desktop/scripts/generate_windows_icon.py "${{ inputs.icon_variant || 'lime' }}"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build Windows installer (NSIS)
        working-directory: desktop/src-tauri
        run: cargo tauri build

      - name: Verify Windows installer
        shell: pwsh
        run: |
          $bundleDir = "desktop/src-tauri/target/release/bundle/nsis"
          $installers = @(Get-ChildItem $bundleDir -Filter "*-setup.exe" -File)
          if ($installers.Count -ne 1) {
            throw "Expected exactly one NSIS setup installer, found $($installers.Count)."
          }
          Write-Host "Installer ready: $($installers[0].Name)"

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Slopchik-Windows-Installer
          path: desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 30
