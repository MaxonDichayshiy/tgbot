name: Build Slopchik Desktop

on:
  workflow_dispatch:
    inputs:
      icon_variant:
        description: "Вариант иконки Windows-приложения"
        required: true
        type: choice
        default: lime
        options:
          - lime
          - lime-invert
          - purple
          - orange
          - pink
          - blue
          - teal
          - rainbow
  push:
    paths:
      - "desktop/src-tauri/**"
      - "desktop/scripts/**"
      - "Brand book/icons/lime/square-1024.png"
      - ".github/workflows/build-desktop.yml"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python for icon generation
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate official Windows app icon
        run: |
          python -m pip install Pillow
          python desktop/scripts/generate_windows_icon.py "${{ inputs.icon_variant || 'lime' }}"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Build Windows installer (NSIS)
        working-directory: desktop/src-tauri
        run: cargo tauri build
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Slopchik-Windows-Installer
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
