name: Release Slopchik Desktop

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: slopchik-desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate signing key
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "Add TAURI_SIGNING_PRIVATE_KEY to GitHub Actions secrets before publishing. TAURI_SIGNING_PRIVATE_KEY_PASSWORD is only needed when the key is password-protected."
          }

      - name: Set up Python for icon generation
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate official Windows app icon
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python desktop/scripts/generate_windows_icon.py

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Enable signed updater artifacts
        shell: pwsh
        run: |
          $configPath = "desktop/src-tauri/tauri.conf.json"
          $config = Get-Content $configPath -Raw | ConvertFrom-Json
          $config.bundle | Add-Member -NotePropertyName createUpdaterArtifacts -NotePropertyValue $true -Force
          $config | ConvertTo-Json -Depth 100 | Set-Content $configPath -Encoding utf8

      - name: Build signed Windows installer
        working-directory: desktop/src-tauri
        run: cargo tauri build

      - name: Prepare and validate updater manifest
        shell: pwsh
        run: |
          $bundleDir = "desktop/src-tauri/target/release/bundle/nsis"
          $installers = @(Get-ChildItem $bundleDir -Filter "*-setup.exe" -File)
          if ($installers.Count -ne 1) {
            throw "Expected exactly one NSIS setup installer, found $($installers.Count)."
          }

          $installer = $installers[0]
          $signaturePath = "$($installer.FullName).sig"
          if (-not (Test-Path $signaturePath -PathType Leaf)) {
            throw "Updater signature file is missing: $signaturePath"
          }

          $signature = (Get-Content $signaturePath -Raw).Trim()
          if ([string]::IsNullOrWhiteSpace($signature)) {
            throw "Updater signature file is empty."
          }

          $config = Get-Content "desktop/src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json
          $version = [string]$config.version
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "App version is missing from tauri.conf.json."
          }

          $tag = "${{ github.ref_name }}"
          if ($tag -ne "v$version") {
            throw "Git tag $tag must match app version v$version."
          }

          $assetName = [Uri]::EscapeDataString($installer.Name)
          $downloadUrl = "https://github.com/${{ github.repository }}/releases/download/$tag/$assetName"
          $manifest = @{
            version = $version
            notes = "Обновление Слопчика"
            pub_date = [DateTime]::UtcNow.ToString("o")
            platforms = @{
              "windows-x86_64" = @{
                signature = $signature
                url = $downloadUrl
              }
            }
          } | ConvertTo-Json -Depth 10

          Set-Content "latest.json" $manifest -Encoding utf8
          Get-Content "latest.json" -Raw | ConvertFrom-Json | Out-Null
          Write-Host "Validated updater manifest for version $version and installer $($installer.Name)."

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Слопчик Desktop ${{ github.ref_name }}"
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
            desktop/src-tauri/target/release/bundle/nsis/*-setup.exe.sig
            latest.json
