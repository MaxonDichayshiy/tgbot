name: Release Slopchik Desktop

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate signing key
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "Add TAURI_SIGNING_PRIVATE_KEY to GitHub Actions secrets before publishing. TAURI_SIGNING_PRIVATE_KEY_PASSWORD is only needed when the key is password-protected."
          }

      - name: Set up Python for icon generation
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate official Windows app icon
        run: |
          python -m pip install Pillow
          python desktop/scripts/generate_windows_icon.py

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Enable signed updater artifacts
        shell: pwsh
        run: |
          $configPath = "desktop/src-tauri/tauri.conf.json"
          $config = Get-Content $configPath -Raw | ConvertFrom-Json
          $config.bundle | Add-Member -NotePropertyName createUpdaterArtifacts -NotePropertyValue $true -Force
          $config | ConvertTo-Json -Depth 100 | Set-Content $configPath -Encoding utf8

      - name: Build signed Windows installer
        working-directory: desktop/src-tauri
        run: cargo tauri build

      - name: Prepare updater manifest
        shell: pwsh
        run: |
          $bundleDir = "desktop/src-tauri/target/release/bundle/nsis"
          $archive = Get-ChildItem $bundleDir -Filter "*.nsis.zip" | Select-Object -First 1
          if (-not $archive) { throw "Tauri did not create the NSIS updater archive." }

          $signaturePath = "$($archive.FullName).sig"
          if (-not (Test-Path $signaturePath)) { throw "Updater signature file is missing." }

          $config = Get-Content "desktop/src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json
          $version = $config.version
          $tag = "${{ github.ref_name }}"
          if ($tag -ne "v$version") { throw "Git tag $tag must match app version v$version." }

          $signature = Get-Content $signaturePath -Raw
          $assetName = [Uri]::EscapeDataString($archive.Name)
          $downloadUrl = "https://github.com/${{ github.repository }}/releases/download/$tag/$assetName"

          $manifest = @{
            version = $version
            notes = "Обновление Слопчика"
            platforms = @{
              "windows-x86_64" = @{
                signature = $signature.Trim()
                url = $downloadUrl
              }
            }
          } | ConvertTo-Json -Depth 10

          Set-Content "latest.json" $manifest -Encoding utf8

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Слопчик Desktop ${{ github.ref_name }}"
          generate_release_notes: true
          files: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/nsis/*.nsis.zip
            desktop/src-tauri/target/release/bundle/nsis/*.nsis.zip.sig
            latest.json
