name: Android APK

# Собирает Android-приложение (оболочка вокруг веб-приложения Слопчика) бесплатно на серверах GitHub.
# Запуск: вкладка Actions → «Android APK» → Run workflow. Готовый файл — в разделе Releases.
on:
  workflow_dispatch:
    inputs:
      app_url:
        description: "Адрес веб-приложения"
        default: "https://tgbot-naew.onrender.com/app/"

permissions:
  contents: write

env:
  APP_URL: ${{ github.event.inputs.app_url || 'https://tgbot-naew.onrender.com/app/' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Создать проект приложения
        run: |
          set -e
          mkdir -p android/app/src/main/java/ru/slopchik/app android/app/src/main/res/values
          cd android

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "Slopchik"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }

          def appUrl = project.findProperty("appUrl") ?: "https://tgbot-naew.onrender.com/app/"
          def verCode = (project.findProperty("verCode") ?: "1").toInteger()

          android {
              namespace 'ru.slopchik.app'
              compileSdk 34
              defaultConfig {
                  applicationId "ru.slopchik.app"
                  minSdk 24
                  targetSdk 34
                  versionCode verCode
                  versionName "1.0." + verCode
                  buildConfigField "String", "APP_URL", "\"" + appUrl + "\""
              }
              buildFeatures { buildConfig true }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <application
                  android:label="@string/app_name"
                  android:icon="@mipmap/ic_launcher"
                  android:allowBackup="false"
                  android:usesCleartextTraffic="false"
                  android:theme="@style/AppTheme">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:windowSoftInputMode="adjustResize"
                      android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout|uiMode">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Слопчик</string>
          </resources>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="bg">#0F1115</color>
              <style name="AppTheme" parent="android:Theme.DeviceDefault.NoActionBar">
                  <item name="android:windowBackground">@color/bg</item>
                  <item name="android:statusBarColor">@color/bg</item>
                  <item name="android:navigationBarColor">@color/bg</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/java/ru/slopchik/app/MainActivity.java <<'EOF'
          package ru.slopchik.app;

          import android.Manifest;
          import android.app.Activity;
          import android.app.AlertDialog;
          import android.content.ContentValues;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.os.Handler;
          import android.os.Looper;
          import android.provider.MediaStore;
          import android.util.Base64;
          import android.view.ViewGroup;
          import android.webkit.JsPromptResult;
          import android.webkit.JsResult;
          import android.webkit.PermissionRequest;
          import android.webkit.URLUtil;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceError;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.EditText;
          import android.widget.FrameLayout;
          import android.widget.ProgressBar;
          import android.widget.Toast;

          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.OutputStream;
          import java.nio.charset.StandardCharsets;

          public class MainActivity extends Activity {
              private static final int REQ_FILE = 1;
              private static final int REQ_MIC = 2;

              private WebView web;
              private ProgressBar bar;
              private ValueCallback<Uri[]> fileCallback;
              private PermissionRequest pendingPermission;
              private final Handler ui = new Handler(Looper.getMainLooper());
              private int retries = 0;
              private String appHost;

              @Override
              protected void onCreate(Bundle state) {
                  super.onCreate(state);
                  appHost = Uri.parse(BuildConfig.APP_URL).getHost();

                  FrameLayout root = new FrameLayout(this);
                  root.setBackgroundColor(0xFF0F1115);
                  web = new WebView(this);
                  root.addView(web, new FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                  bar = new ProgressBar(this, null, android.R.attr.progressBarStyleHorizontal);
                  bar.setMax(100);
                  root.addView(bar, new FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, 6));
                  setContentView(root);

                  web.setBackgroundColor(0xFF0F1115);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setAllowFileAccess(false);
                  s.setMixedContentMode(WebSettings.MIXED_CONTENT_NEVER_ALLOW);

                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r) {
                          Uri u = r.getUrl();
                          if ("data".equals(u.getScheme()) || "blob".equals(u.getScheme())) return false;
                          if (appHost != null && appHost.equals(u.getHost())) return false;
                          try { startActivity(new Intent(Intent.ACTION_VIEW, u)); } catch (Exception ignored) { }
                          return true;
                      }

                      @Override
                      public void onReceivedError(WebView v, WebResourceRequest r, WebResourceError e) {
                          if (r.isForMainFrame()) showWaiting();
                      }

                      @Override
                      public void onPageFinished(WebView v, String url) {
                          if (url != null && url.startsWith("http")) retries = 0;
                      }
                  });

                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onProgressChanged(WebView v, int p) {
                          bar.setProgress(p);
                          bar.setVisibility(p >= 100 ? ProgressBar.GONE : ProgressBar.VISIBLE);
                      }

                      @Override
                      public boolean onShowFileChooser(WebView v, ValueCallback<Uri[]> cb, FileChooserParams params) {
                          if (fileCallback != null) fileCallback.onReceiveValue(null);
                          fileCallback = cb;
                          Intent i = new Intent(Intent.ACTION_GET_CONTENT);
                          i.addCategory(Intent.CATEGORY_OPENABLE);
                          i.setType("*/*");
                          i.putExtra(Intent.EXTRA_MIME_TYPES, new String[]{
                                  "image/*", "application/pdf", "text/*", "application/json",
                                  "application/vnd.openxmlformats-officedocument.wordprocessingml.document",
                                  "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
                          try {
                              startActivityForResult(Intent.createChooser(i, "Выберите файл"), REQ_FILE);
                          } catch (Exception e) {
                              fileCallback = null;
                              return false;
                          }
                          return true;
                      }

                      @Override
                      public void onPermissionRequest(final PermissionRequest request) {
                          runOnUiThread(() -> {
                              String host = request.getOrigin() == null ? "" : request.getOrigin().getHost();
                              if (appHost == null || !appHost.equals(host)) { request.deny(); return; }
                              if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) == PackageManager.PERMISSION_GRANTED) {
                                  request.grant(request.getResources());
                              } else {
                                  pendingPermission = request;
                                  requestPermissions(new String[]{Manifest.permission.RECORD_AUDIO}, REQ_MIC);
                              }
                          });
                      }

                      @Override
                      public boolean onJsAlert(WebView v, String url, String msg, final JsResult r) {
                          new AlertDialog.Builder(MainActivity.this).setMessage(msg)
                                  .setPositiveButton("OK", (d, w) -> r.confirm())
                                  .setOnCancelListener(d -> r.cancel()).show();
                          return true;
                      }

                      @Override
                      public boolean onJsConfirm(WebView v, String url, String msg, final JsResult r) {
                          new AlertDialog.Builder(MainActivity.this).setMessage(msg)
                                  .setPositiveButton("OK", (d, w) -> r.confirm())
                                  .setNegativeButton("Отмена", (d, w) -> r.cancel())
                                  .setOnCancelListener(d -> r.cancel()).show();
                          return true;
                      }

                      @Override
                      public boolean onJsPrompt(WebView v, String url, String msg, String def, final JsPromptResult r) {
                          final EditText input = new EditText(MainActivity.this);
                          input.setText(def == null ? "" : def);
                          new AlertDialog.Builder(MainActivity.this).setMessage(msg).setView(input)
                                  .setPositiveButton("OK", (d, w) -> r.confirm(input.getText().toString()))
                                  .setNegativeButton("Отмена", (d, w) -> r.cancel())
                                  .setOnCancelListener(d -> r.cancel()).show();
                          return true;
                      }
                  });

                  web.setDownloadListener((url, ua, cd, mime, len) -> {
                      try {
                          if (url.startsWith("data:")) {
                              int comma = url.indexOf(',');
                              String meta = url.substring(5, comma);
                              byte[] bytes = meta.contains(";base64")
                                      ? Base64.decode(url.substring(comma + 1), Base64.DEFAULT)
                                      : Uri.decode(url.substring(comma + 1)).getBytes(StandardCharsets.UTF_8);
                              String type = (mime == null || mime.isEmpty()) ? meta.split(";")[0] : mime;
                              String name = URLUtil.guessFileName(url, cd, type);
                              if (type.contains("wordprocessingml")) name = "Документ.docx";
                              save(bytes, name, type);
                          } else {
                              startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse(url)));
                          }
                      } catch (Exception e) {
                          Toast.makeText(this, "Не удалось сохранить файл", Toast.LENGTH_LONG).show();
                      }
                  });

                  web.loadUrl(BuildConfig.APP_URL);
              }

              /** Бесплатный Render «засыпает»: ждём, пока сервер проснётся, и пробуем снова. */
              private void showWaiting() {
                  retries++;
                  String url = BuildConfig.APP_URL;
                  if (retries <= 14) {
                      web.loadDataWithBaseURL(null, page("Сервер просыпается… " + retries, ""), "text/html", "utf-8", null);
                      ui.postDelayed(() -> web.loadUrl(url), 5000);
                  } else {
                      web.loadDataWithBaseURL(null, page("Нет связи с сервером",
                              "<button onclick=\"location.href='" + url + "'\">Повторить</button>"), "text/html", "utf-8", null);
                      retries = 0;
                  }
              }

              private String page(String text, String extra) {
                  return "<html><body style='background:#0f1115;color:#e8eaf0;font-family:sans-serif;display:flex;"
                          + "flex-direction:column;align-items:center;justify-content:center;height:100vh;margin:0'>"
                          + "<h3>" + text + "</h3>" + extra
                          + "<style>button{padding:12px 24px;font-size:17px;border:0;border-radius:12px;background:#3b82f6;color:#fff}</style>"
                          + "</body></html>";
              }

              private void save(byte[] data, String name, String mime) throws Exception {
                  if (Build.VERSION.SDK_INT >= 29) {
                      ContentValues v = new ContentValues();
                      v.put(MediaStore.Downloads.DISPLAY_NAME, name);
                      v.put(MediaStore.Downloads.MIME_TYPE, mime);
                      v.put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS);
                      Uri u = getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, v);
                      try (OutputStream o = getContentResolver().openOutputStream(u)) { o.write(data); }
                  } else {
                      File dir = getExternalFilesDir(Environment.DIRECTORY_DOWNLOADS);
                      try (OutputStream o = new FileOutputStream(new File(dir, name))) { o.write(data); }
                  }
                  Toast.makeText(this, "Сохранено в «Загрузки»: " + name, Toast.LENGTH_LONG).show();
              }

              @Override
              protected void onActivityResult(int req, int res, Intent data) {
                  if (req == REQ_FILE && fileCallback != null) {
                      fileCallback.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(res, data));
                      fileCallback = null;
                  } else {
                      super.onActivityResult(req, res, data);
                  }
              }

              @Override
              public void onRequestPermissionsResult(int req, String[] perms, int[] results) {
                  if (req == REQ_MIC && pendingPermission != null) {
                      if (results.length > 0 && results[0] == PackageManager.PERMISSION_GRANTED) {
                          pendingPermission.grant(pendingPermission.getResources());
                      } else {
                          pendingPermission.deny();
                      }
                      pendingPermission = null;
                  }
              }

              @Override
              public void onBackPressed() {
                  if (web.canGoBack()) web.goBack(); else super.onBackPressed();
              }

              @Override
              protected void onPause() { super.onPause(); web.onPause(); }

              @Override
              protected void onResume() { super.onResume(); web.onResume(); }
          }
          EOF

      - name: Иконка приложения
        run: |
          sudo apt-get install -y imagemagick >/dev/null
          cd android/app/src/main/res
          for d in "mdpi 48" "hdpi 72" "xhdpi 96" "xxhdpi 144" "xxxhdpi 192"; do
            set -- $d
            mkdir -p mipmap-$1
            convert "$GITHUB_WORKSPACE/webapp/icon-512.png" -resize "$2x$2" "mipmap-$1/ic_launcher.png"
          done

      - name: Собрать APK
        run: |
          cd android
          gradle assembleDebug --no-daemon --stacktrace \
            -PappUrl="$APP_URL" -PverCode="${{ github.run_number }}"

      - name: Сохранить как файл
        uses: actions/upload-artifact@v4
        with:
          name: slopchik-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Выложить в Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Slopchik.apk
          gh release create "apk-${{ github.run_number }}" Slopchik.apk \
            --title "Слопчик для Android #${{ github.run_number }}" \
            --notes "Установка: скачайте Slopchik.apk, откройте и разрешите установку из этого источника."