name: Slopchik
options:
  bundleIdPrefix: ru.maxondichayshiy
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  Slopchik:
    type: application
    platform: iOS
    sources:
      - Sources
      - Assets.xcassets
    resources:
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.maxondichayshiy.slopchik
        PRODUCT_NAME: Slopchik
        MARKETING_VERSION: "0.9.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Слопчик
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Слопчик использует микрофон для записи голосовых сообщений."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "SlopchikLimeInvert SlopchikPurple SlopchikOrange SlopchikPink SlopchikBlue SlopchikTeal SlopchikRainbow"
        SWIFT_EMIT_LOC_STRINGS: YES
    info:
      path: Info.plist
